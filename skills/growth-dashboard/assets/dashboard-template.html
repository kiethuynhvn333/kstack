<title>Growth Overview</title>
<!--
  Growth dashboard template (kstack skills/growth-dashboard). Follows references/ui-spec.md.
  To use: replace the JSON inside <script id="dashboard-data"> below. For the standard layout nothing
  else needs editing; extra charts or cards are added by hand following references/ui-spec.md.
  As shipped, it holds SAMPLE data for a made-up marketplace (Northwind Market): open it to see the result.

  DATA FORMAT
  {
    "title": "Growth Overview",            page title
    "sample": false,                       true shows a "Sample — not your data" badge
    "asOf": "2026-10-26",                  last date in the data
    "grain": "month" | "week",             period ids: "YYYY-MM" or the Monday "YYYY-MM-DD"
    "currency": "$",                       symbol put before money values
    "segments": ["All", ...],              "All" first
    "sources": [ {"id","name","group"} ],  in stack order; group e.g. "Paid", "Owned", "Organic";
                                           mark the catch-all with "unlinked": true
    "metrics": [ {"id","name","sub","phrase","format","good","perDay"} ]
        phrase: optional words for the takeaway sentence, e.g. "buyers contacting a seller a day"
        format: "int" | "money" (compact) | "money_full" | "percent" (0–1)
        good:   "up" | "down" | "neutral"   (colors the change)
        perDay: true for totals (leads, cost) so partial periods compare per day
        people: true for metrics that count people (signups, sellers, buyers, users). With one row per
                source there is no de-duplicated total: leave the "total" row empty for them
                (shown as "—"). build_workbook.py refuses a people total equal to the sum of sources.
    "tileGroups":   [ {"label": "Volume", "metrics": ["id", ...]} ]       max 4 per group
    "contribution": {"metric", "title", "note", "shareGroup"}             stacked bars; shareGroup
                                           labels each bar with that group's share of Total
    "efficiency":   {"metric", "sources": ["id" | "total"], "title", "note"}   lines; optional (leave out
                                           when there is no spend data: the card is hidden)
    "funnel":       {"steps": ["id", ...], "title", "note"}               optional
    "status":       {"metric", "efficiencyMetric", "threshold": 0.05, "title", "note"}   optional; defaults
                                           to the contribution metric
    "table":        {"metrics": ["id", ...]}                              optional, default all
    "notes": ["plain sentence", ...]
    "rows": [ {"period", "segment", "source": "<id>" | "total", "days", "values": {"id": number|null}} ]
        "total" rows come from raw data (people overlap across sources, so do not sum them)
  }
-->

<style>
  /* Layout: header → filters → tile groups → two chart cards → funnel → status → table → notes */
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --line: #e3e2dd; --fg: #1c1c1a; --muted: #6a6964;
    --ok: #1d7a4c; --bad: #b42318; --warn: #9a6700;
    --grid: #ecebe6; --axis: #c8c7c1; --ref: #8c8b85; --series-muted: #bdbcb5; --skeleton: #ecebe6;
    --s1: #2f6fd6; --s2: #d9822b; --s3: #7a5bd6; --s4: #1f9e89; --s5: #c94f7c; --s6: #8a9a2b; --s7: #4aa3c9; --s8: #a0522d;
    --font-text: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --fs-caption: 12px; --fs-body: 14px; --fs-heading: 16px; --fs-title: 28px;
    --g-xs: 4px; --g-sm: 8px; --g-md: 12px; --g-lg: 16px; --g-xl: 24px; --radius: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181817; --panel: #222220; --line: #353532; --fg: #ecebe6; --muted: #a4a39d;
      --ok: #5cc48e; --bad: #f4776b; --warn: #e3b252;
      --grid: #2c2c2a; --axis: #4b4b47; --ref: #8c8b85; --series-muted: #5b5a55; --skeleton: #2c2c2a;
      --s1: #6f9ff2; --s2: #f2a65e; --s3: #a68ef2; --s4: #4fcab3; --s5: #e883aa; --s6: #b6c75d; --s7: #80c7e8; --s8: #d48a64;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181817; --panel: #222220; --line: #353532; --fg: #ecebe6; --muted: #a4a39d;
    --ok: #5cc48e; --bad: #f4776b; --warn: #e3b252;
    --grid: #2c2c2a; --axis: #4b4b47; --ref: #8c8b85; --series-muted: #5b5a55; --skeleton: #2c2c2a;
    --s1: #6f9ff2; --s2: #f2a65e; --s3: #a68ef2; --s4: #4fcab3; --s5: #e883aa; --s6: #b6c75d; --s7: #80c7e8; --s8: #d48a64;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-text); font-size: var(--fs-body); }
  .gd { max-width: 1280px; margin: 0 auto; padding-block: var(--g-xl); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: var(--g-xl); }
  .gd-head { display: grid; gap: var(--g-sm); }
  .gd-title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--g-md); }
  .gd-title { margin: 0; font-family: var(--font-num); font-weight: 400; font-size: 30px; text-wrap: balance; }
  .gd-badge { font-size: var(--fs-caption); color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 2px 10px; }
  .gd-takeaway { margin: 0; color: var(--muted); max-width: 75ch; line-height: 1.55; }
  .gd-takeaway b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .gd-filters { display: flex; flex-wrap: wrap; gap: var(--g-md); align-items: center; }
  .gd-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .gd-seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; padding: 6px 14px; cursor: pointer; }
  .gd-seg button + button { border-left: 1px solid var(--line); }
  .gd-seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .gd-seg button:focus-visible, .gd-select:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .gd-select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; }
  .gd-fresh { margin-left: auto; color: var(--muted); font-size: var(--fs-caption); }
  .gd-group { display: grid; gap: var(--g-sm); }
  .gd-label { margin: 0; font-size: var(--fs-caption); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .gd-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--g-md); }
  .gd-tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--g-lg); display: grid; gap: var(--g-xs); align-content: start; min-width: 0; }
  .gd-tile-name { font-size: var(--fs-caption); color: var(--muted); }
  .gd-tile-value { font-family: var(--font-num); font-size: var(--fs-title); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .gd-chg { font-size: var(--fs-caption); color: var(--muted); font-variant-numeric: tabular-nums; }
  .is-good { color: var(--ok); } .is-bad { color: var(--bad); }
  .gd-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: var(--g-md); }
  .gd-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--g-lg); display: grid; gap: var(--g-sm); align-content: start; min-width: 0; }
  .gd-card h2 { margin: 0; font-size: var(--fs-heading); font-weight: 500; }
  .gd-note { margin: 0; color: var(--muted); font-size: var(--fs-caption); line-height: 1.45; }
  .gd-chart { position: relative; min-height: 260px; }
  .gd-legend { display: flex; flex-wrap: wrap; gap: var(--g-sm) var(--g-md); font-size: var(--fs-caption); color: var(--muted); }
  .gd-sw { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 2px; margin-right: 0.35rem; }
  .gd-tip { position: absolute; pointer-events: none; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.12); padding: 6px 10px; font-size: var(--fs-caption); font-variant-numeric: tabular-nums; white-space: nowrap; display: grid; gap: 2px; }
  .gd-tip-head { color: var(--muted); }
  .gd-scroll { overflow: auto; max-height: 36rem; }

  .gd-table th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .gd-table td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }

  .gd-table tr.gd-total td { font-weight: 600; }
  .gd-table tr.gd-sub td:first-child { color: var(--muted); }
  .gd-pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: var(--fs-caption); border: 1px solid currentColor; }

  .gd-share { display: inline-flex; align-items: center; justify-content: flex-end; min-width: 9rem; }
  .gd-notes { margin: 0; padding-left: 1.1rem; display: grid; gap: var(--g-xs); color: var(--muted); font-size: var(--fs-caption); line-height: 1.5; max-width: 90ch; }
  .gd-empty { color: var(--muted); font-size: var(--fs-caption); }
  .gd-skel { display: inline-block; width: 5rem; height: 1em; border-radius: 4px; background: var(--skeleton); vertical-align: middle; }
</style>
</head>
<body>
<div class="gd">
  <header class="gd-head" id="summary">
    <div class="gd-title-row">
      <h1 class="gd-title" id="page-title">Growth Overview</h1>
      <span class="gd-badge" id="sample-badge" hidden>Sample — not your data</span>
    </div>
    <p class="gd-takeaway" id="takeaway"><span class="gd-skel"></span></p>
  </header>

  <div class="gd-filters" id="filters">
    <div class="gd-seg" role="group" aria-label="Segment" id="segment-picker"></div>
    <select class="gd-select" id="period-picker" aria-label="Period"></select>
    <span class="gd-fresh" id="fresh"></span>
  </div>

  <div id="tile-groups" class="gd-head"></div>

  <div class="gd-cards">
    <section class="gd-card" id="contribution">
      <h2 id="contribution-title"></h2>
      <p class="gd-note" id="contribution-note"></p>
      <div class="gd-legend" id="contribution-legend"></div>
      <div class="gd-chart" id="contribution-chart"></div>
    </section>
    <section class="gd-card" id="efficiency">
      <h2 id="efficiency-title"></h2>
      <p class="gd-note" id="efficiency-note"></p>
      <div class="gd-legend" id="efficiency-legend"></div>
      <div class="gd-chart" id="efficiency-chart"></div>
    </section>
  </div>

  <section class="gd-card" id="funnel" hidden>
    <h2 id="funnel-title"></h2>
    <p class="gd-note" id="funnel-note"></p>
    <div class="gd-chart" id="funnel-chart" style="min-height: 0"></div>
  </section>

  <section class="gd-card" id="sources">
    <h2 id="status-title"></h2>
    <p class="gd-note" id="status-note"></p>
    <div class="gd-scroll">
      <table class="gd-table" id="status-table"><thead></thead><tbody></tbody></table>
    </div>
  </section>

  <section class="gd-card" id="detail">
    <h2 id="table-title"></h2>
    <p class="gd-note">Every segment and source for the period picked above. Bold rows are totals.</p>
    <div class="gd-scroll">
      <table class="gd-table" id="detail-table"><thead></thead><tbody></tbody></table>
    </div>
  </section>

  <section class="gd-card" id="notes">
    <h2>How to read this</h2>
    <ul class="gd-notes" id="notes-list"></ul>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('dashboard-data').textContent);
  const $ = (id) => document.getElementById(id);
  const TOTAL = 'total';
  const metric = Object.fromEntries(D.metrics.map((m) => [m.id, m]));
  const source = Object.fromEntries(D.sources.map((s, i) => [s.id, { ...s, i }]));
  const cur = D.currency || '$';
  const state = { segment: D.segments[0], period: null };

  // ---------- formatting ----------
  const fInt = d3.format(',.0f');
  const fmt = (id, v) => {
    if (v == null || Number.isNaN(v)) return '—';
    const f = metric[id]?.format || 'int';
    if (f === 'percent') return d3.format('.1%')(v);
    if (f === 'money_full') return cur + (Math.abs(v) < 100 ? d3.format(',.2f')(v) : fInt(v));
    if (f === 'money') {
      const a = Math.abs(v);
      if (a >= 1e9) return cur + d3.format(',.2f')(v / 1e9) + 'B';
      if (a >= 1e6) return cur + d3.format(',.2f')(v / 1e6) + 'M';
      return cur + fInt(v);
    }
    return fInt(v);
  };
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const colorOf = (id) => (id === TOTAL ? css('--fg') : source[id]?.unlinked ? css('--series-muted') : css(`--s${(source[id].i % 8) + 1}`));
  const nameOf = (id) => (id === TOTAL ? 'Total' : source[id]?.name || id);

  // ---------- periods ----------
  const isMonth = D.grain !== 'week';
  const pDate = (p) => new Date((isMonth ? p + '-01' : p) + 'T00:00:00Z');
  const pLen = (p) => { if (!isMonth) return 7; const d = pDate(p); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); };
  const pName = (p) => (isMonth ? d3.utcFormat('%b %Y')(pDate(p)) : 'Week of ' + d3.utcFormat('%-d %b %Y')(pDate(p)));
  const pShort = (p, narrow) => (isMonth ? d3.utcFormat(narrow ? '%b' : '%b %y')(pDate(p)) : d3.utcFormat('%-d %b')(pDate(p)));
  const days = (p, seg) => get(p, seg || 'All', TOTAL)?.days ?? pLen(p);
  const pLabel = (p) => { const n = days(p); return n < pLen(p) ? `${pName(p)} (${isMonth ? '1–' + n : n + ' days'})` : pName(p); };

  // ---------- data access ----------
  const idx = new Map(D.rows.map((r) => [`${r.period}|${r.segment}|${r.source}`, r]));
  const get = (p, seg, src) => idx.get(`${p}|${seg}|${src}`);
  const val = (p, seg, src, m) => { const r = get(p, seg, src); const v = r?.values?.[m]; return v == null ? null : Number(v); };
  const periods = [...new Set(D.rows.map((r) => r.period))].sort();
  const prevOf = (p) => periods[periods.indexOf(p) - 1];
  const change = (p, seg, src, m) => {
    const q = prevOf(p); if (!q) return null;
    let a = val(p, seg, src, m), b = val(q, seg, src, m);
    if (a == null || b == null) return null;
    if (metric[m]?.format === 'percent') return { pts: a - b };
    if (metric[m]?.perDay) { a /= days(p, seg); b /= days(q, seg); }
    if (b === 0) return null;
    return { pct: a / b - 1 };
  };
  const chgText = (c) => (c == null ? '' : c.pts != null ? d3.format('+.1f')(c.pts * 100) + ' pts' : d3.format('+.1%')(c.pct));
  const chgClass = (c, m) => {
    if (c == null) return '';
    const x = c.pts != null ? c.pts : c.pct, small = c.pts != null ? 0.0005 : 0.005;
    const good = metric[m]?.good || 'up';
    if (Math.abs(x) < small || good === 'neutral') return '';
    return (x > 0) === (good === 'up') ? 'is-good' : 'is-bad';
  };

  // ---------- shared chart helpers ----------
  const legend = (host, ids) => host.replaceChildren(...ids.map((id) => {
    const s = document.createElement('span'), w = document.createElement('span');
    w.className = 'gd-sw'; w.style.background = colorOf(id);
    s.append(w, nameOf(id)); return s;
  }));
  const tipFor = (host) => {
    let t = host.querySelector('.gd-tip');
    if (!t) { t = document.createElement('div'); t.className = 'gd-tip'; t.hidden = true; host.appendChild(t); }
    return t;
  };
  const showTip = (host, t, event, head, lines) => {
    const h = document.createElement('div'); h.className = 'gd-tip-head'; h.textContent = head;
    t.replaceChildren(h, ...lines.map(([label, value, color]) => {
      const r = document.createElement('div');
      if (color) { const w = document.createElement('span'); w.className = 'gd-sw'; w.style.background = color; r.appendChild(w); }
      r.append(`${label}: ${value}`); return r;
    }));
    t.hidden = false;
    const [x, y] = d3.pointer(event, host);
    t.style.left = Math.max(0, Math.min(host.clientWidth - t.offsetWidth, x + 12)) + 'px';
    t.style.top = Math.max(0, Math.min(host.clientHeight - t.offsetHeight, y - 10)) + 'px';
  };
  const measure = (svg, texts) => {
    const g = svg.append('g').style('font-size', 'var(--fs-caption)');
    const w = d3.max(texts, (s) => g.append('text').text(s).node().getComputedTextLength()) || 0;
    g.remove(); return w;
  };
  const caption = (sel) => sel.style('fill', 'var(--muted)').style('font-size', 'var(--fs-caption)');
  const newSvg = (host, H, label) => {
    host.querySelectorAll('svg, .gd-empty').forEach((n) => n.remove());
    const W = Math.max(280, host.clientWidth);
    const svg = d3.select(host).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', label);
    return { svg, W };
  };
  const empty = (host, text) => {
    host.querySelectorAll('svg, .gd-empty').forEach((n) => n.remove());
    const p = document.createElement('p'); p.className = 'gd-empty'; p.textContent = text; host.appendChild(p);
  };
  const grid = (svg, y, ticks, x0, x1, fmtTick) => {
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', x0).attr('x2', x1).attr('y1', y).attr('y2', y).style('stroke', 'var(--grid)');
    caption(svg.append('g').selectAll('text').data(ticks).join('text').attr('x', x0 - 6).attr('y', y).attr('dy', '0.32em').attr('text-anchor', 'end')).text(fmtTick);
  };

  // ---------- contribution: stacked bars ----------
  function drawContribution() {
    const c = D.contribution, host = $('contribution-chart'), seg = state.segment;
    $('contribution-title').textContent = c.title; $('contribution-note').textContent = c.note || '';
    const ids = D.sources.map((s) => s.id);
    legend($('contribution-legend'), ids);
    const data = periods.map((p) => {
      const o = { p, raw: {} }; ids.forEach((id) => { o.raw[id] = val(p, seg, id, c.metric); o[id] = o.raw[id] || 0; });
      o.sum = d3.sum(ids, (id) => o[id]); o.total = val(p, seg, TOTAL, c.metric);
      o.share = c.shareGroup && o.total ? d3.sum(D.sources.filter((s) => s.group === c.shareGroup), (s) => o[s.id]) / o.total : null;
      return o;
    });
    if (!d3.max(data, (d) => d.sum)) return empty(host, 'No data for this segment.');
    const H = 260, { svg, W } = newSvg(host, H, c.title);
    const y = d3.scaleLinear([0, d3.max(data, (d) => d.sum) * 1.15], [H - 24, 22]).nice();
    const ticks = y.ticks(4), tf = (v) => fmt(c.metric, v);
    const left = measure(svg, ticks.map(tf)) + 10;
    const x = d3.scaleBand(periods, [left, W - 4]).padding(0.3);
    const bw = Math.min(32, x.bandwidth()), off = (x.bandwidth() - bw) / 2;
    grid(svg, y, ticks, left, W - 4, tf);
    svg.append('g').selectAll('g').data(d3.stack().keys(ids)(data)).join('g').style('fill', (s) => colorOf(s.key))
      .selectAll('rect').data((s) => s).join('rect')
      .attr('x', (d) => x(d.data.p) + off).attr('width', bw).attr('y', (d) => y(d[1])).attr('height', (d) => Math.max(0, y(d[0]) - y(d[1]))).attr('rx', 2);
    if (c.shareGroup) {
      svg.append('g').selectAll('text').data(data).join('text').attr('x', (d) => x(d.p) + x.bandwidth() / 2).attr('y', (d) => y(d.sum) - 6)
        .attr('text-anchor', 'middle').style('fill', 'var(--fg)').style('font-size', 'var(--fs-caption)').text((d) => (d.share == null ? '' : d3.format('.1%')(d.share)));
    }
    caption(svg.append('g').selectAll('text').data(periods).join('text').attr('x', (p) => x(p) + x.bandwidth() / 2).attr('y', H - 6).attr('text-anchor', 'middle')).text((p) => pShort(p, W < 440));
    const t = tipFor(host);
    svg.append('g').selectAll('rect').data(data).join('rect').attr('x', (d) => x(d.p)).attr('width', x.bandwidth()).attr('y', 0).attr('height', H).style('fill', 'transparent')
      .on('mousemove', (e, d) => showTip(host, t, e, pLabel(d.p), [
        ...ids.slice().reverse().map((id) => [nameOf(id), fmt(c.metric, d.raw[id]), colorOf(id)]),
        ['Total', fmt(c.metric, d.total)],
        ...(d.share == null ? [] : [[`${c.shareGroup} share`, d3.format('.1%')(d.share)]]),
      ]))
      .on('mouseleave', () => { t.hidden = true; });
  }

  // ---------- efficiency: lines with end labels ----------
  function drawEfficiency() {
    const c = D.efficiency, host = $('efficiency-chart'), seg = state.segment;
    $('efficiency').hidden = !(c && c.metric && c.sources?.length);  // optional: no spend data, no cost chart
    if ($('efficiency').hidden) return;
    $('efficiency-title').textContent = c.title; $('efficiency-note').textContent = c.note || '';
    const series = c.sources.map((id) => ({ id, pts: periods.map((p) => ({ p, v: val(p, seg, id, c.metric) })).filter((d) => d.v != null && d.v > 0) })).filter((s) => s.pts.length);
    legend($('efficiency-legend'), series.map((s) => s.id));
    if (!series.length) return empty(host, 'No cost data for this segment.');
    const H = 260, { svg, W } = newSvg(host, H, c.title);
    const y = d3.scaleLinear([0, d3.max(series, (s) => d3.max(s.pts, (d) => d.v)) * 1.1], [H - 24, 12]).nice();
    const ticks = y.ticks(4), tf = (v) => fmt(c.metric, v), tickF = (v) => tf(v).replace(/\.00$/, '');
    const left = measure(svg, ticks.map(tickF)) + 10;
    const ends = series.map((s) => `${nameOf(s.id)} ${tf(s.pts[s.pts.length - 1].v)}`);
    const right = measure(svg, ends) + 14;
    const x = d3.scalePoint(periods, [left + 10, W - right]);
    grid(svg, y, ticks, left, W - right + 6, tickF);
    caption(svg.append('g').selectAll('text').data(periods).join('text').attr('x', x).attr('y', H - 6).attr('text-anchor', 'middle')).text((p) => pShort(p, W < 440));
    const line = d3.line().x((d) => x(d.p)).y((d) => y(d.v));
    series.forEach((s) => {
      svg.append('path').attr('d', line(s.pts)).style('fill', 'none').style('stroke', colorOf(s.id)).style('stroke-width', 2).style('stroke-linecap', 'round').style('stroke-linejoin', 'round');
      svg.append('g').selectAll('circle').data(s.pts).join('circle').attr('cx', (d) => x(d.p)).attr('cy', (d) => y(d.v)).attr('r', 2.5).style('fill', colorOf(s.id));
    });
    const labels = series.map((s, i) => { const l = s.pts[s.pts.length - 1]; return { text: ends[i], x: x(l.p), y: y(l.v), color: colorOf(s.id) }; }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 14);
    svg.append('g').selectAll('text').data(labels).join('text').attr('x', (l) => l.x + 8).attr('y', (l) => l.y).attr('dy', '0.32em').style('fill', (l) => l.color).style('font-size', 'var(--fs-caption)').text((l) => l.text);
    const t = tipFor(host);
    const rule = svg.append('line').attr('y1', 12).attr('y2', H - 24).style('stroke', 'var(--ref)').attr('visibility', 'hidden');
    svg.append('rect').attr('x', left).attr('width', Math.max(0, W - right - left + 6)).attr('y', 0).attr('height', H).style('fill', 'transparent')
      .on('mousemove', (e) => {
        const [mx] = d3.pointer(e);
        const p = periods.reduce((b, q) => (Math.abs(x(q) - mx) < Math.abs(x(b) - mx) ? q : b), periods[0]);
        rule.attr('x1', x(p)).attr('x2', x(p)).attr('visibility', 'visible');
        showTip(host, t, e, pLabel(p), series.map((s) => [nameOf(s.id), tf(s.pts.find((d) => d.p === p)?.v), colorOf(s.id)]));
      })
      .on('mouseleave', () => { t.hidden = true; rule.attr('visibility', 'hidden'); });
  }

  // ---------- funnel ----------
  function drawFunnel() {
    const c = D.funnel; if (!c || !c.steps?.length) return;
    $('funnel').hidden = false; $('funnel-title').textContent = c.title; $('funnel-note').textContent = c.note || '';
    const host = $('funnel-chart');
    const steps = c.steps.map((m) => ({ m, v: val(state.period, state.segment, TOTAL, m) }));
    if (steps.some((s) => s.v == null)) return empty(host, 'Not every funnel step has data for this segment and period.');
    const rowH = 34, H = steps.length * rowH + 8, { svg, W } = newSvg(host, H, c.title);
    const names = steps.map((s) => metric[s.m].name);
    const left = measure(svg, names) + 14;
    const valW = measure(svg, steps.map((s) => fmt(s.m, s.v) + '   kept 100.0%')) + 12;
    const x = d3.scaleLinear([0, steps[0].v || 1], [0, Math.max(40, W - left - valW)]);
    const drops = steps.map((s, i) => (i === 0 || !steps[i - 1].v ? null : 1 - s.v / steps[i - 1].v));
    const worst = d3.maxIndex(drops.map((d) => (d == null ? -1 : d)));
    steps.forEach((s, i) => {
      const y0 = 4 + i * rowH;
      caption(svg.append('text').attr('x', left - 10).attr('y', y0 + rowH / 2 - 2).attr('dy', '0.32em').attr('text-anchor', 'end')).style('fill', 'var(--fg)').text(names[i]);
      svg.append('rect').attr('x', left).attr('y', y0 + 4).attr('height', rowH - 12).attr('width', Math.max(2, x(s.v))).attr('rx', 2).style('fill', i === worst && drops[i] != null ? 'var(--bad)' : colorOf(D.sources[0].id));
      caption(svg.append('text').attr('x', left + Math.max(2, x(s.v)) + 8).attr('y', y0 + rowH / 2 - 2).attr('dy', '0.32em'))
        .text(fmt(s.m, s.v) + (drops[i] == null ? '' : `   kept ${d3.format('.1%')(1 - drops[i])}`));
    });
  }

  // ---------- status of each source ----------
  function drawStatus() {
    const c = { metric: D.contribution.metric, title: 'Status of each source of growth', ...(D.status || {}) };
    const seg = state.segment, p = state.period, th = c.threshold ?? 0.05;
    $('status-title').textContent = c.title; $('status-note').textContent = c.note || `Change vs the period before. Growing or declining = more than ${d3.format('.0%')(th)} either way.`;
    const total = val(p, seg, TOTAL, c.metric);
    const rows = D.sources.map((s) => {
      const v = val(p, seg, s.id, c.metric), prev = prevOf(p) ? val(prevOf(p), seg, s.id, c.metric) : null;
      const ch = change(p, seg, s.id, c.metric);
      let status = 'No data';
      if (v != null && v > 0) status = !prev ? 'New' : ch?.pct > th ? 'Growing' : ch?.pct < -th ? 'Declining' : 'Flat';
      return { s, v, share: total && v != null ? v / total : null, ch, status, eff: c.efficiencyMetric ? val(p, seg, s.id, c.efficiencyMetric) : null };
    }).sort((a, b) => (b.v || 0) - (a.v || 0));
    const head = ['Source', 'Group', metric[c.metric].name, 'Share of total', 'Change', 'Status', ...(c.efficiencyMetric ? [metric[c.efficiencyMetric].name] : [])];
    const thead = $('status-table').querySelector('thead');
    thead.replaceChildren(row('th', head));
    const maxShare = d3.max(rows, (r) => r.share || 0) || 1;
    $('status-table').querySelector('tbody').replaceChildren(...rows.map((r) => {
      const tr = document.createElement('tr');
      const cells = [nameOf(r.s.id), r.s.group || '', fmt(c.metric, r.v)];
      cells.forEach((v) => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      const share = document.createElement('td'), wrap = document.createElement('span'), bar = document.createElement('span');
      wrap.className = 'gd-share'; bar.className = 'gd-bar';
      bar.style.width = `${Math.round(((r.share || 0) / maxShare) * 70)}px`; bar.style.background = colorOf(r.s.id);
      wrap.append(bar, r.share == null ? '—' : d3.format('.1%')(r.share)); share.appendChild(wrap); tr.appendChild(share);
      const chg = document.createElement('td'); chg.textContent = chgText(r.ch) || '—'; chg.className = chgClass(r.ch, c.metric); tr.appendChild(chg);
      const st = document.createElement('td'), pill = document.createElement('span');
      pill.className = 'gd-pill ' + r.status.toLowerCase().replace(' ', ''); pill.textContent = r.status; st.appendChild(pill); tr.appendChild(st);
      if (c.efficiencyMetric) { const td = document.createElement('td'); td.textContent = fmt(c.efficiencyMetric, r.eff); tr.appendChild(td); }
      return tr;
    }));
  }
  const row = (tag, cells) => { const tr = document.createElement('tr'); cells.forEach((v) => { const c = document.createElement(tag); c.textContent = v; tr.appendChild(c); }); return tr; };

  // ---------- detail table ----------
  function drawTable() {
    const ms = D.table?.metrics || D.metrics.map((m) => m.id), p = state.period;
    $('table-title').textContent = `All segments, ${pLabel(p)}`;
    $('detail-table').querySelector('thead').replaceChildren(row('th', ['Segment', 'Source', ...ms.map((m) => metric[m].name)]));
    const trs = [];
    D.segments.forEach((seg) => [TOTAL, ...D.sources.map((s) => s.id)].forEach((src) => {
      const r = get(p, seg, src); if (!r) return;
      const tr = row('td', [seg, nameOf(src), ...ms.map((m) => fmt(m, val(p, seg, src, m)))]);
      tr.className = src === TOTAL ? 'gd-total' : 'gd-sub'; trs.push(tr);
    }));
    $('detail-table').querySelector('tbody').replaceChildren(...trs);
  }

  // ---------- header, tiles, takeaway ----------
  function drawHeader() {
    const seg = state.segment, p = state.period;
    const c = D.contribution, m = c.metric;
    const v = val(p, seg, TOTAL, m), ch = change(p, seg, TOTAL, m);
    const top = D.sources.filter((s) => !s.unlinked).map((s) => ({ s, v: val(p, seg, s.id, m) || 0 })).sort((a, b) => b.v - a.v)[0];
    const tk = $('takeaway'); tk.replaceChildren();
    const b = (text) => { const e = document.createElement('b'); e.textContent = text; return e; };
    tk.append(`In ${pLabel(p)}, ${seg === 'All' ? 'the business' : seg} had `, b(fmt(m, v)), ` ${metric[m].phrase || metric[m].name}`);
    if (ch) tk.append(' (', b(chgText(ch)), ' vs the period before)');
    tk.append('.');
    if (top && v) tk.append(` The biggest source was ${top.s.name} with `, b(d3.format('.1%')(top.v / v)), ' of it.');
    const host = $('tile-groups');
    host.replaceChildren(...D.tileGroups.map((g) => {
      const sec = document.createElement('section'); sec.className = 'gd-group';
      const lab = document.createElement('p'); lab.className = 'gd-label'; lab.textContent = g.label;
      const tiles = document.createElement('div'); tiles.className = 'gd-tiles';
      g.metrics.forEach((id) => {
        const mm = metric[id], t = document.createElement('div'); t.className = 'gd-tile';
        const n = document.createElement('div'); n.className = 'gd-tile-name'; n.textContent = mm.sub ? `${mm.name} · ${mm.sub}` : mm.name;
        const vv = document.createElement('div'); vv.className = 'gd-tile-value'; vv.textContent = fmt(id, val(p, seg, TOTAL, id));
        const c2 = change(p, seg, TOTAL, id), cc = document.createElement('div'); cc.className = 'gd-chg ' + chgClass(c2, id);
        cc.textContent = c2 ? `${chgText(c2)} ${mm.perDay ? 'per day ' : ''}vs period before` : prevOf(p) ? 'No comparison' : 'First period shown';
        t.append(n, vv, cc); tiles.appendChild(t);
      });
      sec.append(lab, tiles); return sec;
    }));
  }

  // ---------- controls ----------
  function controls() {
    $('page-title').textContent = D.title || 'Growth Overview';
    document.title = D.title || 'Growth Overview';
    $('sample-badge').hidden = !D.sample;
    $('fresh').textContent = 'Data to ' + d3.utcFormat('%-d %b %Y')(new Date(D.asOf + 'T00:00:00Z'));
    $('notes-list').replaceChildren(...(D.notes || []).map((n) => { const li = document.createElement('li'); li.textContent = n; return li; }));
    const segBox = $('segment-picker');
    segBox.replaceChildren(...D.segments.map((s) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
      b.addEventListener('click', () => { state.segment = s; render(); }); return b;
    }));
    const full = periods.filter((p) => days(p) >= pLen(p));
    state.period = full[full.length - 1] || periods[periods.length - 1];
    const sel = $('period-picker');
    sel.replaceChildren(...periods.slice().reverse().map((p) => new Option(pLabel(p), p)));
    sel.addEventListener('change', () => { state.period = sel.value; render(); });
  }

  function render() {
    [...$('segment-picker').children].forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === state.segment)));
    $('period-picker').value = state.period;
    drawHeader(); drawContribution(); drawEfficiency(); drawFunnel(); drawStatus(); drawTable();
  }

  controls(); render();
  let w = window.innerWidth;
  window.addEventListener('resize', () => { if (window.innerWidth !== w) { w = window.innerWidth; render(); } });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
})();
</script>
</body>
</html>
